server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: codestep
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codestep}
    username: ${DB_USER:codestep}
    password: ${DB_PASSWORD:codestep}
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    async:
      request-timeout: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: codestep
    distribution:
      percentiles-histogram:
        codestep.judge.duration: true
        codestep.queue.wait: true

codestep:
  # redis: Redis Stream between any number of API instances and workers (docker-compose).
  # memory: in-process queue, one container (the "single" profile, used on Railway).
  queue: ${CODESTEP_QUEUE:redis}
  api:
    enabled: ${CODESTEP_API_ENABLED:true}
    max-in-flight-per-client: 3
    max-queued: ${CODESTEP_MAX_QUEUED:100}
    submissions-per-minute-per-ip: ${CODESTEP_SUBMISSIONS_PER_MINUTE_PER_IP:20}
    submissions-per-hour: ${CODESTEP_SUBMISSIONS_PER_HOUR:300}
  worker:
    enabled: ${CODESTEP_WORKER_ENABLED:true}
    threads: ${CODESTEP_WORKER_THREADS:2}

judge:
  # docker: a fresh container per submission. local: runner/judged.sh in the same container.
  mode: ${JUDGE_MODE:docker}
  image: ${JUDGE_IMAGE:codestep-runner:latest}
  runtime: ${JUDGE_RUNTIME:}
  time-limit-seconds: 2
  max-code-length: 50000
