map $request_method $submission_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $submission_limit_key zone=submissions:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location ~ ^/api/submissions/[^/]+/events$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /api/submissions {
        limit_req zone=submissions burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
